[project]
name = "financial-strategy"
version = "0.1.0"
description = "Point-in-time LangGraph equity volatility research workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.11",
    "httpx>=0.28",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "numpy>=2.0",
    "polars>=1.30",
    "pydantic>=2.10",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "scipy>=1.14",
    "typer>=0.16",
    "yfinance>=0.2.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.scripts]
financial-strategy = "financial_strategy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
