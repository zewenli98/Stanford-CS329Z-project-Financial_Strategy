task:
  universe_snapshot_id: universe_2026-10-01_2026-10-14_v1
  decision_cutoff: "2026-10-14T09:00:00-04:00"
  target_session: "2026-10-14"
  top_k: 10
  price_lookback_sessions: 60
  news_lookback_days: 7

calendar:
  name: XNYS

data:
  universe: tests/fixtures/integration/universe/symbols.json
  market_bars: tests/fixtures/integration/market/daily_bars.parquet
  corporate_actions: tests/fixtures/integration/market/corporate_actions.jsonl
  company_evidence: tests/fixtures/integration/company/evidence.jsonl
  macro_events: tests/fixtures/integration/macro/events.jsonl
  macro_documents: tests/fixtures/integration/macro/documents
  sector_exposures: configs/sector_exposures.json
  input_adjustment_policy: split_adjusted
  snapshot_adjustment_policy: split_adjusted
  zero_volume_policy: require_explicit_no_trade_status

features:
  required_complete_sessions: 21
  imputation: none

screening:
  candidate_multiplier: 2
  minimum_candidates: 6
  volatility_weight: 0.60
  anomaly_weight: 0.40

ranking:
  minimum_score: 0.0
  final_weights:
    volatility: 0.5833333333333334
    anomaly: 0.4166666666666667
    company_event: 0.0
    macro: 0.0
  volatility_weights:
    median_abs_oc_return_20d: 0.60
    realized_volatility_20d: 0.40
  anomaly_weights:
    abs_return_5d: 0.35
    previous_session_relative_volume: 0.40
    abs_distance_to_ma20: 0.25
  percentile:
    tie_method: average
    singleton_value: 0.5
  company_event:
    status_factors:
      released_before_cutoff: 1.00
      scheduled_during_session: 0.70
      scheduled_before_open: 0.60
      scheduled_after_close: 0.15
      timing_unknown: 0.00
      no_event_found: 0.00
    type_factors:
      earnings: 1.00
      guidance: 1.00
      merger_acquisition: 0.90
      buyback: 0.75
      dividend: 0.50
      financing: 0.75
      litigation_regulatory: 0.90
      management_change: 0.50
      product: 0.30
      cybersecurity: 0.90
    confidence_factors:
      high: 1.00
      medium: 0.75
      low: 0.50
    recency:
      - {max_sessions: 1, factor: 1.00}
      - {max_sessions: 3, factor: 0.70}
      - {max_sessions: 7, factor: 0.40}
  macro:
    exposure_method: sector_heuristic_v1
    supported_risk_factors: [inflation, interest_rates, oil_prices, usd]
    confidence_factors:
      high: 1.00
      medium: 0.75
      low: 0.50
    surprise_factors:
      small: 0.40
      moderate: 0.70
      large: 1.00
    surprise_bins:
      small_upper_exclusive: 1.0
      moderate_upper_exclusive: 2.0
    surprise_scales:
      cpi_yoy: 0.10
      unemployment: 0.10
      nonfarm_payrolls: 50.0
      fed_rate: 25.0
      dgs2: 0.10
      dgs10: 0.10
      vixcls: 2.0
      gdp: 0.50
    scheduled_strength:
      scheduled_before_open: 0.50
      scheduled_during_session: 0.50
      scheduled_after_close: 0.15
      timing_unknown: 0.00

retrieval:
  algorithm: bm25
  top_n: 8
  k1: 1.5
  b: 0.75
  tokenizer_version: nfkc_alnum_v1

agents:
  mode: live
  provider: openrouter
  model: openai/gpt-5.6-luna
  recordings_path: tests/fixtures/integration/llm/recordings
  cache_path: cache/llm
  max_parallel_symbols: 2
  macro_max_tool_calls: 4
  company_max_tool_calls_per_symbol: 5
  max_model_calls_per_symbol: 8
  max_total_tool_calls: 110
  max_total_model_calls: 170
  roles:
    macro_evidence:
      prompt_version: macro_v1
      max_tokens: 2048
    company_evidence:
      prompt_version: company_v1
      max_tokens: 2048
    synthesis:
      prompt_version: synthesis_v2
      max_tokens: 2048
    verifier:
      prompt_version: verifier_v1
      max_tokens: 2048

retry:
  technical_max_retries: 2
  structured_repair_max_retries: 1
  backoff_seconds: [1.0, 2.0]

revision:
  max_rounds: 2

output:
  runs_path: runs
